name: Weekly GitHub Trending Digest

on:
  schedule:
    # 每周六早晨 09:00 (北京时间 UTC+8，即 UTC 01:00) 自动触发
    - cron: '0 1 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-digest:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行热榜抓取、AI提炼与微信推送
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || vars.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || vars.OPENAI_MODEL }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN || vars.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WECHAT_WORK_KEY: ${{ secrets.WECHAT_WORK_KEY }}
          RECIPIENT_NAME: ${{ vars.RECIPIENT_NAME || '彭杰仔' }}
        run: |
          python main.py

      - name: 将历史记录与最新简报提交回仓库
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json latest_report.md
          if git diff --staged --quiet; then
            echo "没有需要提交的新内容"
          else
            git commit -m "chore: update trending digest & history [skip ci]"
            git push || echo "提示：如需将更新记录回写仓库，请在仓库 Settings -> Actions -> General 中勾选 'Read and write permissions'。"
          fi
